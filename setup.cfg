[metadata]
name = aruba-mm-session-cleanup
version = 0.2.0
description = Fail-closed Aruba Mobility session cleanup with explicit operator approval.
license = MIT

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.9
install_requires =
    netmiko>=4.3.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    bandit>=1.8.6
    cyclonedx-bom>=7.3.1
    pip-audit>=2.9.0
    pip-tools>=7.6.1
    pyinstaller>=6.0
    pytest>=8.0
    ruff>=0.12.12

[options.entry_points]
console_scripts =
    aruba-mm-cleanup = aruba_mm_cleanup.cli:main
    aruba-mm-cleanup-gui = aruba_mm_cleanup.gui_app:main
    aruba-mm-cleanup-web = aruba_mm_cleanup.web_app:main
