name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish tagged release
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime and release tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r .\requirements.lock
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install -c .\constraints.txt bandit cyclonedx-bom pip-audit pyinstaller pytest ruff
          python -m pip check

      - name: Verify semantic version tag
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag $tag is not a semantic version tag."
          }
          $tagObjectType = git cat-file -t "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or $tagObjectType -ne "tag") {
            throw "Tag $tag must be an existing annotated tag."
          }
          $headCommit = git rev-parse HEAD
          $tagCommit = git rev-list -n 1 $tag
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) {
            throw "Checked-out commit $headCommit does not match tag $tag ($tagCommit)."
          }
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $releaseHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseResponse = Invoke-WebRequest -Uri $releaseUri -Headers $releaseHeaders -SkipHttpErrorCheck
          if ($releaseResponse.StatusCode -eq 200) {
            throw "Release $tag already exists; refusing to overwrite it."
          }
          if ($releaseResponse.StatusCode -ne 404) {
            throw "Could not safely confirm that Release $tag is absent (HTTP $($releaseResponse.StatusCode))."
          }
          $version = python -c "from aruba_mm_cleanup import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Version lookup failed." }
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package version v$version."
          }
          $assetName = "aruba-mm-session-cleanup_${tag}_windows.zip"
          $checksumName = "$assetName.sha256"
          $sbomName = "aruba-mm-session-cleanup_${tag}_sbom.cdx.json"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT
          "sbom_name=$sbomName" >> $env:GITHUB_OUTPUT

      - name: Run validation and security gates
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1
          ruff check src tests tools
          bandit -q -ll -r src -c pyproject.toml
          python -m pip_audit -r requirements.lock --strict

      - name: Build Windows release package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_gui_exe.ps1 -ReleaseTag "${{ steps.metadata.outputs.tag }}"

      - name: Verify Windows release package
        shell: pwsh
        run: python .\tools\verify_release_package.py --dist .\dist --smoke-gui --smoke-web --require-gui-smoke --require-web-smoke

      - name: Prepare ZIP, checksum, and SBOM assets
        id: assets
        shell: pwsh
        run: |
          $assetDir = Join-Path $PWD "release_assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $assetName = "${{ steps.metadata.outputs.asset_name }}"
          $checksumName = "${{ steps.metadata.outputs.checksum_name }}"
          $sbomName = "${{ steps.metadata.outputs.sbom_name }}"
          $sourceZip = Join-Path ".\dist" $assetName
          if (-not (Test-Path -LiteralPath $sourceZip)) {
            throw "Expected release zip was not generated: $sourceZip"
          }
          $assetPath = Join-Path $assetDir $assetName
          Copy-Item -LiteralPath $sourceZip -Destination $assetPath -Force
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $assetDir $checksumName
          "$sha256  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ASCII
          $sbomPath = Join-Path $assetDir $sbomName
          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          cyclonedx-py environment $pythonExe --pyproject pyproject.toml --output-reproducible --output-format JSON --output-file $sbomPath
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX SBOM generation failed." }
          if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf) -or (Get-Item -LiteralPath $sbomPath).Length -le 0) {
            throw "CycloneDX SBOM file is missing or empty."
          }
          python -c "import json; json.load(open(r'$sbomPath', encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX SBOM JSON validation failed." }
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          "sbom_path=$sbomPath" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Verify release assets
        shell: pwsh
        run: |
          python .\tools\verify_release_package.py `
            --zip "${{ steps.assets.outputs.asset_path }}" `
            --smoke-gui `
            --smoke-web `
            --require-gui-smoke `
            --require-web-smoke `
            --expected-sha256 "${{ steps.assets.outputs.sha256 }}"
          $checksum = (Get-Content -LiteralPath "${{ steps.assets.outputs.checksum_path }}" -Raw).Trim()
          if (-not $checksum.StartsWith("${{ steps.assets.outputs.sha256 }}  ")) {
            throw "Checksum sidecar does not match the ZIP."
          }

      - name: Create draft release
        id: create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" `
            "${{ steps.assets.outputs.asset_path }}#${{ steps.metadata.outputs.asset_name }}" `
            "${{ steps.assets.outputs.checksum_path }}#${{ steps.metadata.outputs.checksum_name }}" `
            "${{ steps.assets.outputs.sbom_path }}#${{ steps.metadata.outputs.sbom_name }}" `
            --repo "${{ github.repository }}" `
            --title "Aruba MM Session Cleanup ${{ steps.metadata.outputs.tag }}" `
            --notes-file ".\RELEASE_NOTES.md" `
            --verify-tag `
            --draft

      - name: Publish release
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.metadata.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --draft=false

      - name: Remove incomplete draft while preserving the tag
        if: failure() && steps.create_release.outcome != 'skipped'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.metadata.outputs.tag }}"
          $releaseJson = gh release view $tag --repo "${{ github.repository }}" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and (ConvertFrom-Json $releaseJson).isDraft) {
            gh release delete $tag --repo "${{ github.repository }}" --yes
          }
