name: PR Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: Tests, lint, dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install -c constraints.txt bandit cyclonedx-bom pip-audit pytest ruff
          python -m pip check

      - name: Run tests and static checks
        run: |
          python -m pytest -q
          python -m compileall -q src
          ruff check src tests tools
          bandit -q -ll -r src -c pyproject.toml

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock --strict

      - name: Build and parse CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py requirements requirements.lock --output-format JSON --output-file artifacts/sbom.cdx.json
          python -c "import json; json.load(open('artifacts/sbom.cdx.json', encoding='utf-8'))"

  windows-verify:
    name: Windows package verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Run validation
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1

      - name: Build Windows release package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_gui_exe.ps1

      - name: Verify Windows release package
        shell: pwsh
        run: python .\tools\verify_release_package.py --dist .\dist --smoke-gui --smoke-web --require-gui-smoke --require-web-smoke
